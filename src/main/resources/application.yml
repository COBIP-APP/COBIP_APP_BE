spring:
  application:
    name: cobip
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cobip_app}
    username: ${DB_USERNAME:cobip}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
