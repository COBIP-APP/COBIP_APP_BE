name: cobip-app

services:
  app:
    profiles: [full]
    build: .
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:8080:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/cobip_app
      REDIS_HOST: redis
    volumes:
      - type: bind
        source: ./config/application-local.yml
        target: /app/config/application-local.yml
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cobip_app
      POSTGRES_USER: cobip
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cobip -d cobip_app"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
